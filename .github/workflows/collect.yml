name: Collect data
on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 12 * * *'
jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: collect
        run: uv run epex-de-history
      - name: Commit new map
        run: |
          git config --global user.name 'Collect Bot'
          git config --global user.email 'noreply@gohr.digital'
          git add .
          git commit -m ":arrow_up: Add data for today"
          git pull -r
          git push
